html,body{height:100%}

/* ═══════════════ 纹样管理后台 · 纯前端 Mock SPA（无构建、无外部依赖） ═══════════════ */
(function(){

/* ── 认证：统一 token key，并与主站 admin_gate.js 对齐 ── */
var TOKEN_KEY='wenyao:admin_token';        // 后台 SPA 读取的 token（唯一可信源）
var LEGACY_KEY='admin_token';              // 主站 admin_gate.js 写入的兼容 key
var ADMIN_USER='admin', ADMIN_PASS='Admin123456';
var TOKEN_TTL=2*60*60*1000;                // 登录态有效期 2 小时

function readJSON(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function writeJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function removeKey(k){try{localStorage.removeItem(k);}catch(e){}}

/* 读取有效 token：兼容主站遗留 admin_token；过期自动清除并返回 null */
function getValidToken(){
  var t=readJSON(TOKEN_KEY);
  if(t&&t.token&&t.exp&&Date.now()<t.exp)return t;
  // 清理任何失效/损坏的 token
  if(t) removeKey(TOKEN_KEY);
  // 兼容：从主站 admin_gate.js 跳过来的遗留 admin_token
  var legacy=readJSON(LEGACY_KEY);
  if(legacy&&legacy.token){
    var migrated={token:legacy.token, user:'admin', iat:Date.now(), exp:Date.now()+TOKEN_TTL};
    writeJSON(TOKEN_KEY,migrated); removeKey(LEGACY_KEY);
    return migrated;
  }
  return null;
}
function setToken(){
  var tok={token:'mock-token-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),
    user:'admin', iat:Date.now(), exp:Date.now()+TOKEN_TTL};
  writeJSON(TOKEN_KEY,tok);
  return tok;
}
function clearToken(){removeKey(TOKEN_KEY);removeKey(LEGACY_KEY);}
function isAuthed(){return !!getValidToken();}

function saveOverrides(){
  var out={};

    var src=null;
    for(var i=0;i<PATTERNS_SRC.length;i++) if(PATTERNS_SRC[i].id===p.id){src=PATTERNS_SRC[i];break;}

/* ── 统计 ── */
function missingCount(){var n=0;patterns.forEach(function(p){if(p.status==='缺图')n++;});return n;}
function catStats(){
  /* 按五大主题聚合 574 枚纹样的真实分类（32 类）：
     几何纹样 / 动物纹样 / 植物纹样 / 吉祥纹样(符号+组合) / 器物与专题(其余) */
  var g={'几何纹样':0,'动物纹样':0,'植物纹样':0,'吉祥纹样':0,'器物与专题':0};
  patterns.forEach(function(p){
    var c=p.category||'';
    if(c.indexOf('几何')>=0)g['几何纹样']++;
    else if(c.indexOf('动物')>=0)g['动物纹样']++;
    else if(c.indexOf('植物')>=0)g['植物纹样']++;
    else if(c.indexOf('吉祥')>=0)g['吉祥纹样']++;
    else g['器物与专题']++;
  });
  return Object.keys(g).map(function(k){return{k:k,v:g[k],c:DONUT_COLORS[k]};});
}
function catCount(){var m={};patterns.forEach(function(p){m[p.category]=1;});return Object.keys(m).length;}
function dynStats(){
  var m={};patterns.forEach(function(p){m[p.period]=(m[p.period]||0)+1;});
  var arr=Object.keys(m).map(function(k){return{k:k,v:m[k]};});
  arr.sort(function(a,b){return b.v-a.v;});
  var top=arr.slice(0,7),rest=0;arr.slice(7).forEach(function(x){rest+=x.v;});
  var res=top;if(rest>0)res=res.concat([{k:'其他',v:rest}]);
  return res;
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtDate(t){var d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function fmtDur(ms){return ms>=1000?(ms/1000).toFixed(2)+' s':ms+' ms';}
function toast(msg,err){
  var t=document.createElement('div');t.className='ad-toast'+(err?' err':'');
  t.innerHTML=(err?'⚠️':'✅')+' '+esc(msg);document.body.appendChild(t);

}

function loginRequest(u,p){
  /* 真实网络探测：先确认服务可达，再比对凭证。
     - 服务不可达 / 超时 → 网络异常
     - 可达但凭证错误 → 账号或密码错误
     - 可达且凭证正确 → 登录成功 */
  return new Promise(function(resolve,reject){
    if(typeof fetch!=='function'){ // 极端情况下退化为纯本地校验
      if(p===ADMIN_PASS&&(u===ADMIN_USER||u.indexOf('@')>=0))resolve({ok:true});
      else reject(new Error('net'));
      return;
    }
    var ctrl;
    var hasAbort=typeof AbortController==='function';
    if(hasAbort){ctrl=new AbortController();}
    var timer=setTimeout(function(){
      if(ctrl)ctrl.abort();
      reject(new Error('timeout'));
    },6000);
    fetch('/api/patterns?probe='+Date.now(),{cache:'no-store',signal:ctrl?ctrl.signal:undefined})
      .then(function(){
        clearTimeout(timer);
        if(p===ADMIN_PASS&&(u===ADMIN_USER||u.indexOf('@')>=0))resolve({ok:true});
        else resolve({ok:false,reason:'cred'});
      })
      .catch(function(){clearTimeout(timer);reject(new Error('net'));});
  });
}

    var errEl=document.getElementById('ad-err');
    var btn=document.getElementById('ad-submit');
    errEl.textContent='登录中…';errEl.className='ad-login__err ad-login__loading';

        var c=document.querySelector('.ad-login__card');c.classList.remove('ad-shake');void c.offsetWidth;c.classList.add('ad-shake');

  };
}

/* ── 看板 · 分类占比环形图（纯 SVG：引线标签 + 图例点击切换 + Tooltip） ── */
var DONUT_COLORS={'几何纹样':'#8B1A1A','动物纹样':'#C89B3C','植物纹样':'#3C5A4A','吉祥纹样':'#2A5C8A','器物与专题':'#D48806'};
function donutPanel(){
  var data=catStats();
  var total=data.reduce(function(s,x){return s+x.v;},0);
  var vis=data.filter(function(x){return !ui.donutHide[x.k];});
  var sumVis=vis.reduce(function(s,x){return s+x.v;},0);
  var CX=160,CY=150,R1=88,R0=56,LR=110,svg='';
  function pt(r,a){return (CX+r*Math.cos(a)).toFixed(2)+' '+(CY+r*Math.sin(a)).toFixed(2);}
  if(sumVis<=0){
    svg='<circle cx="'+CX+'" cy="'+CY+'" r="'+((R0+R1)/2)+'" fill="none" stroke="#e8e0d0" stroke-width="'+(R1-R0)+'"/>';
  }else if(vis.length===1){
    svg='<circle class="ad-dseg" cx="'+CX+'" cy="'+CY+'" r="'+((R0+R1)/2)+'" fill="none" stroke="'+vis[0].c
      +'" stroke-width="'+(R1-R0)+'" data-name="'+esc(vis[0].k)+'" data-v="'+vis[0].v+'" data-pct="100.0"/>';
  }else{
    var a0=-Math.PI/2,labels=[];
    vis.forEach(function(x){
      var a1=a0+x.v/sumVis*2*Math.PI,large=(a1-a0)>Math.PI?1:0;
      svg+='<path class="ad-dseg" d="M '+pt(R1,a0)+' A '+R1+' '+R1+' 0 '+large+' 1 '+pt(R1,a1)
        +' L '+pt(R0,a1)+' A '+R0+' '+R0+' 0 '+large+' 0 '+pt(R0,a0)+' Z" fill="'+x.c
        +'" data-name="'+esc(x.k)+'" data-v="'+x.v+'" data-pct="'+(x.v/sumVis*100).toFixed(1)+'"/>';
      var mid=(a0+a1)/2;
      if(x.v/sumVis>=0.03){ /* 空间足够才出引线标签，过小仅靠 Tooltip */
        labels.push({k:x.k,v:x.v,x:CX+LR*Math.cos(mid),y:CY+LR*Math.sin(mid),
          dir:CX+LR*Math.cos(mid)>=CX?1:-1,
          ax:CX+(R1+4)*Math.cos(mid),ay:CY+(R1+4)*Math.sin(mid)});
      }
      a0=a1;
    });
    /* 同侧标签防重叠：按 y 排序后强制最小间距 26px */
    ['1','-1'].forEach(function(d){
      var g=labels.filter(function(L){return String(L.dir)===d;}).sort(function(a,b){return a.y-b.y;});
      for(var i=1;i<g.length;i++){if(g[i].y<g[i-1].y+26)g[i].y=g[i-1].y+26;}
    });
    labels.forEach(function(L){
      svg+='<line x1="'+L.ax.toFixed(1)+'" y1="'+L.ay.toFixed(1)+'" x2="'+(L.x-L.dir*6).toFixed(1)+'" y2="'+(L.y-4).toFixed(1)+'" stroke="#b3a48e" stroke-width="1"/>';
      svg+='<text x="'+L.x.toFixed(1)+'" y="'+L.y.toFixed(1)+'" text-anchor="'+(L.dir>0?'start':'end')+'" font-size="12" fill="#6b5744">'+esc(L.k)+'</text>';
      svg+='<text x="'+L.x.toFixed(1)+'" y="'+(L.y+14).toFixed(1)+'" text-anchor="'+(L.dir>0?'start':'end')+'" font-size="13" font-weight="700" fill="#3d2b1f">'+L.v+'</text>';
    });
  }
  return '<div class="ad-donut-stage" id="ad-dstage"><svg viewBox="0 0 320 300" role="img" aria-label="纹样分类占比环形图">'+svg
    +'<text x="'+CX+'" y="'+(CY-2)+'" text-anchor="middle" font-size="30" font-weight="700" fill="#7a1f23" font-family="Georgia,serif">'+sumVis+'</text>'
    +'<text x="'+CX+'" y="'+(CY+22)+'" text-anchor="middle" font-size="11" fill="#8a7a6a">'+(sumVis===total?'纹样总数':'当前展示 · 枚')+'</text></svg>'
    +'<div class="ad-tip" id="ad-dtip"></div></div>'
    +'<div class="ad-dleg">'+data.map(function(x){
      var off=!!ui.donutHide[x.k];
      return '<button type="button" class="ad-dleg-item'+(off?' off':'')+'" data-dleg="'+esc(x.k)+'" title="点击'+(off?'显示':'隐藏')+'「'+esc(x.k)+'」">'
        +'<i style="background:'+x.c+'"></i><span>'+esc(x.k)+'</span><b>'+x.v+'</b></button>';
    }).join('')+'</div>';
}
function bindDonut(){
  var stage=document.getElementById('ad-dstage'),tip=document.getElementById('ad-dtip');
  if(stage&&tip){
    stage.querySelectorAll('.ad-dseg').forEach(function(pth){

        tip.textContent=pth.getAttribute('data-name')+'：'+pth.getAttribute('data-v')+' 枚 · 占比 '+pth.getAttribute('data-pct')+'%';
        tip.style.display='block';
        var x=ev.clientX-r.left+14,y=ev.clientY-r.top+14;
        if(x>r.width-170)x=r.width-175;if(y>r.height-42)y=r.height-44;
        tip.style.left=x+'px';tip.style.top=y+'px';
      });
      pth.addEventListener('mouseleave',function(){tip.style.display='none';});
    });
  }
  document.querySelectorAll('[data-dleg]').forEach(function(b){
    b.onclick=function(){var k=b.getAttribute('data-dleg');ui.donutHide[k]=!ui.donutHide[k];refreshView(true);};
  });
}

function filtered(){
  var q=ui.q.trim().toLowerCase();
  return patterns.filter(function(p){
    if(q&&p.name.toLowerCase().indexOf(q)<0&&p.id.toLowerCase().indexOf(q)<0)return false;
    if(ui.cat&&p.category!==ui.cat)return false;
    if(ui.per&&p.period!==ui.per)return false;
    return true;
  });
}
function pager(total,pages,cur){
  var btns=[];
  function b(l,k,dis,on){return '<button data-p="'+k+'"'+(dis?' disabled':'')+(on?' class="on"':'')+'>'+l+'</button>';}
  btns.push(b('‹',Math.max(1,cur-1),cur===1));
  var show=[];for(var i=1;i<=pages;i++){if(i===1||i===pages||Math.abs(i-cur)<=2)show.push(i);}
  var last=0;show.forEach(function(i){
    if(i-last>1)btns.push('<span style="color:#8a7a6a">…</span>');
    btns.push(b(i,i,false,i===cur));last=i;
  });
  btns.push(b('›',Math.min(pages,cur+1),cur===pages));
  btns.push('<span style="margin-left:8px;color:#8a7a6a">每页 <select class="ad-pagesize" id="ad-ps">'
    +[10,20,50].map(function(s){return '<option value="'+s+'"'+(s===ui.pageSize?' selected':'')+'>'+s+'</option>';}).join('')
    +'</select> 条 · 前往 <input class="ad-goto" id="ad-goto" value="'+cur+'"> 页 / 共 '+pages+' 页</span>');
  return btns.join('');
}

    {id:'FB-2002',name:'王思齐',email:'wangsq@example.com',type:'纠错',content:'「缠枝纹」条目里把唐代写成了宋代，麻烦核对一下出处。',time:now-d-7200000,status:'待处理'},
    {id:'FB-2003',name:'陈砚',email:'chenyan@example.com',type:'合作',content:'我们是文创团队，想探讨纹样授权与联合设计的可能性。',time:now-3600000*5,status:'待处理'}
  ];
}
function fbRead(){
  var arr=readJSON(FB_KEY);
  if(!Array.isArray(arr)){arr=fbSeed();writeJSON(FB_KEY,arr);}
  return arr.map(function(f){
    return {id:f.id||'',name:f.name||'匿名',email:f.email||'—',type:f.type||'其他',
      content:f.content||'',time:f.time||Date.now(),status:f.status||'待处理'};
  });
}
function fbWrite(arr){writeJSON(FB_KEY,arr);}
function fbFiltered(){
  var arr=fbRead();
  if(ui.fbStatus)arr=arr.filter(function(f){return f.status===ui.fbStatus;});
  return arr;
}
function fbPager(total,pages,cur){
  var btns=[];
  function b(l,k,dis,on){return '<button data-fbp="'+k+'"'+(dis?' disabled':'')+(on?' class="on"':'')+'>'+l+'</button>';}
  btns.push(b('‹',Math.max(1,cur-1),cur===1));
  var show=[];for(var i=1;i<=pages;i++){if(i===1||i===pages||Math.abs(i-cur)<=2)show.push(i);}
  var last=0;show.forEach(function(i){
    if(i-last>1)btns.push('<span style="color:#8a7a6a">…</span>');
    btns.push(b(i,i,false,i===cur));last=i;
  });
  btns.push(b('›',Math.min(pages,cur+1),cur===pages));
  btns.push('<span style="margin-left:8px;color:#8a7a6a">每页 <select class="ad-pagesize" id="ad-fbps">'
    +[10,20,50].map(function(s){return '<option value="'+s+'"'+(s===ui.fbPageSize?' selected':'')+'>'+s+'</option>';}).join('')
    +'</select> 条 · 前往 <input class="ad-goto" id="ad-fbgoto" value="'+cur+'"> 页 / 共 '+pages+' 页</span>');
  return btns.join('');
}
function renderFeedback(){
  var list=fbFiltered();
  var pages=Math.max(1,Math.ceil(list.length/ui.fbPageSize));
  if(ui.fbPage>pages)ui.fbPage=pages;
  var rows=list.slice((ui.fbPage-1)*ui.fbPageSize,ui.fbPage*ui.fbPageSize).map(function(f){
    var ok=f.status==='已处理';
    return '<tr><td>'+esc(f.name)+'</td>'
      +'<td>'+esc(f.email)+'</td>'
      +'<td><span class="ad-tag ad-tag--warn">'+esc(f.type)+'</span></td>'
      +'<td style="max-width:300px;line-height:1.6">'+esc(f.content)+'</td>'
      +'<td class="mono" style="white-space:nowrap">'+fmtDate(f.time)+'</td>'
      +'<td><span class="ad-tag '+(ok?'ad-tag--ok':'ad-tag--warn')+'">'+esc(f.status)+'</span></td>'
      +'<td><div class="ad-op">'
      +'<button class="edit" data-fb="'+esc(f.id)+'">👁 查看</button>'
      +(ok?'':'<button class="del" data-fbdone="'+esc(f.id)+'">✓ 标记已处理</button>')
      +'</div></td></tr>';
  }).join('');
  var statusOpts=['','待处理','已处理'].map(function(s){return '<option value="'+s+'"'+(s===ui.fbStatus?' selected':'')+'>'+(s||'全部状态')+'</option>';}).join('');
  var all=fbRead(),pend=all.filter(function(f){return f.status==='待处理';}).length;
  return '<div class="ad-panel" style="padding:16px 20px">'
    +'<div class="ad-note"><span class="ic">💬</span><span>本页展示前端「关于我们 · 意见反馈」提交的留言。数据保存于浏览器 <b>localStorage</b>（演示环境共享存储），管理员可筛选状态并标记处理进度。</span></div>'
    +'<div class="ad-toolbar">'
    +'<select id="ad-fbst">'+statusOpts+'</select>'
    +'<span class="ad-count">共 <b style="color:#9e2a2b">'+all.length+'</b> 条 · 待处理 <b style="color:#b8722c">'+pend+'</b> 条</span></div>'
    +'<table class="ad-table"><thead><tr><th>姓名</th><th>邮箱</th><th>类型</th><th>反馈内容</th><th>提交时间</th><th>状态</th><th>操作</th></tr></thead>'
    +'<tbody>'+(rows||'<tr><td colspan="7" style="text-align:center;color:#8a7a6a;padding:30px">暂无反馈</td></tr>')+'</tbody></table>'
    +'<div class="ad-pager">'+fbPager(list.length,pages,ui.fbPage)+'</div></div>'
    +(ui.fbDetail?fbDetailDialog():'');
}
function fbDetailDialog(){
  var f=null;fbRead().forEach(function(x){if(x.id===ui.fbDetail)f=x;});
  if(!f)return '';
  var ok=f.status==='已处理';
  return '<div class="ad-mask" id="ad-fb-mask"><div class="ad-modal">'
    +'<h3>反馈详情<button class="x" id="ad-fb-x">✕</button></h3>'
    +'<div class="ad-kv"><i>姓名</i>'+esc(f.name)+'</div>'
    +'<div class="ad-kv"><i>邮箱</i>'+esc(f.email)+'</div>'
    +'<div class="ad-kv"><i>类型</i><span class="ad-tag ad-tag--warn">'+esc(f.type)+'</span></div>'
    +'<div class="ad-kv"><i>提交时间</i>'+fmtDate(f.time)+'</div>'
    +'<div class="ad-kv"><i>状态</i><span class="ad-tag '+(ok?'ad-tag--ok':'ad-tag--warn')+'">'+esc(f.status)+'</span></div>'
    +'<div class="ad-h4">反馈内容</div>'
    +'<div class="ad-field"><textarea style="min-height:120px" disabled>'+esc(f.content)+'</textarea></div>'
    +(ok?'':'<div class="ad-btn-row"><button class="ad-btn--sm ad-btn--primary" id="ad-fb-mark">✓ 标记为已处理</button></div>')
    +'</div></div>';
}
function bindFeedback(){
  var st=document.getElementById('ad-fbst');
  if(st)st.onchange=function(){ui.fbStatus=st.value;ui.fbPage=1;refreshView(true);};
  var ps=document.getElementById('ad-fbps');
  if(ps)ps.onchange=function(){ui.fbPageSize=+ps.value;ui.fbPage=1;refreshView(true);};
  document.querySelectorAll('[data-fb]').forEach(function(b){b.onclick=function(){ui.fbDetail=b.getAttribute('data-fb');refreshView();};});
  document.querySelectorAll('[data-fbdone]').forEach(function(b){b.onclick=function(){
    var id=b.getAttribute('data-fbdone');var arr=fbRead();
    arr.forEach(function(f){if(f.id===id)f.status='已处理';});fbWrite(arr);refreshView();toast('已标记为「已处理」');
  };});
  document.querySelectorAll('.ad-pager button[data-fbp]').forEach(function(b){b.onclick=function(){ui.fbPage=+b.getAttribute('data-fbp');refreshView(true);};});
  var g=document.getElementById('ad-fbgoto');
  if(g){g.onkeydown=function(ev){if(ev.key==='Enter'){ev.stopPropagation();
    var pages=Math.max(1,Math.ceil(fbFiltered().length/ui.fbPageSize));
    ui.fbPage=Math.min(Math.max(1,+g.value||1),pages);refreshView(true);}};}
  var mask=document.getElementById('ad-fb-mask');
  if(mask){
    mask.onclick=function(ev){if(ev.target===mask){ui.fbDetail=null;refreshView();}};
    var x=document.getElementById('ad-fb-x');if(x)x.onclick=function(){ui.fbDetail=null;refreshView();};
    var mk=document.getElementById('ad-fb-mark');
    if(mk)mk.onclick=function(){
      var arr=fbRead();arr.forEach(function(f){if(f.id===ui.fbDetail)f.status='已处理';});fbWrite(arr);
      ui.fbDetail=null;refreshView();toast('已标记为「已处理」');
    };
  }
}

/* ═══ 系统设置 ═══ */
function renderSettings(){
  var cfg={};
  try{cfg=JSON.parse(localStorage.getItem('wenyao:site_settings')||'{}');}catch(e){}
  var title=cfg.title||'纹以载道 · 数启新章', sub=cfg.subtitle||'AI 驱动的中国传统纹样数字博物馆';
  return '<div class="ad-panel" style="padding:16px 20px"><h3 style="font-size:15px;color:#7a1f23;margin-bottom:14px">前台首页文案设置</h3>'
    +'<div class="ad-note"><span class="ic">ℹ️</span><span><b>纯 Mock 环境说明：</b>当前为静态部署 + 纯后台 Mock，设置保存至浏览器 localStorage。由于前后台分属独立页面与运行环境，前台刷新后如未读到新文案属正常演示逻辑；可点击「前往首页」验证前台读取效果。</span></div>'
    +'<div class="ad-field"><label>首页主标题 <span id="ad-tc" style="float:right;color:#8a7a6a">'+title.length+' / 30</span></label>'
    +'<input class="ad-input" id="ad-title" maxlength="30" value="'+esc(title)+'"></div>'
    +'<div class="ad-field"><label>首页副标题 <span id="ad-sc" style="float:right;color:#8a7a6a">'+sub.length+' / 60</span></label>'
    +'<input class="ad-input" id="ad-subtitle" maxlength="60" value="'+esc(sub)+'"></div>'
    +'<div style="display:flex;gap:12px;margin-top:6px;flex-wrap:wrap">'
    +'<button class="ad-btn--sm ad-btn--primary" id="ad-cfg-save">✔ 保存设置</button>'
    +'<button class="ad-btn--sm ad-btn--ghost" id="ad-cfg-reset">↺ 恢复默认</button>'
    +'<a class="ad-btn--sm ad-btn--ghost" href="/" target="_blank" style="display:inline-flex;align-items:center;text-decoration:none;color:#8a7a6a">↗ 前往首页</a></div>'
    +'<h3 style="font-size:13px;color:#8a7a6a;margin-top:22px;letter-spacing:2px">实时预览</h3>'
    +'<div class="ad-preview"><div class="pv-banner"><h1 id="ad-pv-t">'+esc(title)+'</h1><p id="ad-pv-s">'+esc(sub)+'</p></div>'
    +'<div class="pv-cap">— 首页 Banner 预览 —</div></div></div>';
}
function bindSettings(){
  var t=document.getElementById('ad-title'),s=document.getElementById('ad-subtitle');
  if(!t)return;
  function sync(){
    document.getElementById('ad-pv-t').textContent=t.value;
    document.getElementById('ad-pv-s').textContent=s.value;
    document.getElementById('ad-tc').textContent=t.value.length+' / 30';
    document.getElementById('ad-sc').textContent=s.value.length+' / 60';
  }
  t.oninput=sync;s.oninput=sync;
  document.getElementById('ad-cfg-save').onclick=function(){
    if(!t.value.trim()){toast('主标题不能为空',true);return;}
    try{localStorage.setItem('wenyao:site_settings',JSON.stringify({title:t.value,subtitle:s.value}));}catch(e){}
    toast('已保存，前台待生效');
  };
  document.getElementById('ad-cfg-reset').onclick=function(){
    localStorage.removeItem('wenyao:site_settings');
    t.value='纹以载道 · 数启新章';s.value='AI 驱动的中国传统纹样数字博物馆';sync();toast('已恢复默认文案');
  };
}

/* ── 视图刷新 ── */
function refreshView(keepFocus){
  var ae=document.activeElement, aid=ae&&ae.id, pos=ae&&ae.selectionStart;
  root.innerHTML=renderLayout();
  bindLayout();
  if(keepFocus&&aid){
    var el=document.getElementById(aid);
    if(el){el.focus();try{el.setSelectionRange(pos,pos);}catch(e){}}
  }
}
/* ── 初始路由 ── */
(function init(){
  var m=location.pathname.match(/^\/admin\/?([a-z-]*)/i);
  var k=m&&m[1]?m[1]:'';
  var authed=isAuthed();
  if(authed){
    // 已登录：合法子路由进入，否则回看板
    if(k==='login'||!TITLES[k]){ui.route='dashboard';history.replaceState({},'','/admin/dashboard');}
    else ui.route=k;
  }else{
    // 未登录（含过期）：仅登录页可访问，其余强制落到登录页
    if(k!=='login'){ui.route='login';history.replaceState({},'','/admin/login');}
    else ui.route='login';
  }
  render();
})();
})();
</script>
